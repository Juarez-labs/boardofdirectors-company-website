<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ceo-a-title">
  <title id="ceo-a-title">CEO — Futuristic HUD Visor (Variant A)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Crown -->
  <polygon points="68,68 76,44 88,60 100,38 112,60 124,44 132,68"
           fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="68" y1="68" x2="132" y2="68" stroke="#F59E0B" stroke-width="2"/>
  <rect x="68" y="68" width="64" height="8" rx="2" fill="#F59E0B" opacity="0.15"/>
  <!-- Crown jewels -->
  <circle cx="100" cy="44" r="5" fill="#F59E0B" opacity="0.9"/>
  <circle cx="80" cy="50" r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="120" cy="50" r="3" fill="#F59E0B" opacity="0.6"/>

  <!-- Head -->
  <circle cx="100" cy="118" r="32" fill="#0E0E16" stroke="#F59E0B" stroke-width="2"/>

  <!-- HUD visor — opaque bar covering eyes, no eyes visible beneath -->
  <rect x="72" y="107" width="56" height="16" rx="4"
        fill="#F59E0B" opacity="0.12" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Visor edge glow -->
  <rect x="72" y="107" width="56" height="2" rx="1" fill="#F59E0B" opacity="0.6"/>
  <rect x="72" y="121" width="56" height="1" rx="1" fill="#F59E0B" opacity="0.3"/>
  <!-- Visor scanlines -->
  <line x1="74" y1="111" x2="126" y2="111" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="74" y1="115" x2="126" y2="115" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.2"/>
  <!-- HUD data dots on visor corners -->
  <circle cx="78" cy="115" r="2" fill="#F59E0B" opacity="0.7"/>
  <circle cx="122" cy="115" r="2" fill="#F59E0B" opacity="0.7"/>
  <!-- Side visor arms extending to ears -->
  <line x1="68" y1="115" x2="72" y2="115" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="128" y1="115" x2="132" y2="115" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Nose bridge (subtle) -->
  <line x1="100" y1="123" x2="100" y2="128" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Confident mouth -->
  <path d="M88,132 Q100,139 112,132" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M56,166 Q68,148 100,148 Q132,148 144,166 L150,175 L50,175 Z"
        fill="#F59E0B" opacity="0.08" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2"/>
</svg>
