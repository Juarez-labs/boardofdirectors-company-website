<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ceo-b-title">
  <title id="ceo-b-title">CEO — Ethereal Band Blindfold (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Crown (more regal — solid fill version) -->
  <polygon points="68,68 76,44 88,60 100,38 112,60 124,44 132,68"
           fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="68" y1="68" x2="132" y2="68" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Crown jewels -->
  <circle cx="100" cy="44" r="6" fill="#F59E0B" opacity="0.9"/>
  <circle cx="100" cy="44" r="3" fill="#0E0E16"/>
  <circle cx="80" cy="50" r="3.5" fill="#F59E0B" opacity="0.7"/>
  <circle cx="120" cy="50" r="3.5" fill="#F59E0B" opacity="0.7"/>

  <!-- Aura rings (power emanation) -->
  <circle cx="100" cy="118" r="44" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.12"/>
  <circle cx="100" cy="118" r="38" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Head -->
  <circle cx="100" cy="118" r="32" fill="#0E0E16" stroke="#F59E0B" stroke-width="2"/>

  <!-- Wrapping bands across the eye zone (Gojo-inspired) -->
  <!-- Main band -->
  <rect x="66" y="108" width="68" height="14" rx="0"
        fill="#0E0E16" stroke="none"/>
  <rect x="66" y="108" width="68" height="14" rx="0"
        fill="#F59E0B" opacity="0.08"/>
  <!-- Top edge of band -->
  <line x1="66" y1="108" x2="134" y2="108" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Bottom edge of band -->
  <line x1="66" y1="122" x2="134" y2="122" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Band wrap effect - converging lines at the sides -->
  <path d="M66,108 Q62,115 66,122" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
  <path d="M134,108 Q138,115 134,122" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Inner band detail lines (cloth texture) -->
  <line x1="68" y1="112" x2="132" y2="112" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.25"/>
  <line x1="68" y1="118" x2="132" y2="118" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.2"/>
  <!-- Ethereal glow along band center -->
  <ellipse cx="100" cy="115" rx="28" ry="4" fill="#F59E0B" opacity="0.06"/>
  <!-- Floating crystal particles near the band (power leaking) -->
  <circle cx="78" cy="106" r="1.5" fill="#F59E0B" opacity="0.5"/>
  <circle cx="88" cy="105" r="1" fill="#F59E0B" opacity="0.35"/>
  <circle cx="112" cy="106" r="1.5" fill="#F59E0B" opacity="0.5"/>
  <circle cx="122" cy="105" r="1" fill="#F59E0B" opacity="0.35"/>
  <circle cx="70" cy="115" r="2" fill="#F59E0B" opacity="0.4"/>
  <circle cx="130" cy="115" r="2" fill="#F59E0B" opacity="0.4"/>

  <!-- Mouth — slight smirk (confident) -->
  <path d="M90,132 Q102,140 112,133" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

  <!-- Shoulders — broader, more authoritative -->
  <path d="M52,166 Q64,146 100,146 Q136,146 148,166 L155,175 L45,175 Z"
        fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Collar detail -->
  <path d="M84,148 L100,158 L116,148" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round"/>
</svg>
