<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ux-b-title">
  <title id="ux-b-title">UX Designer — Monocle Observer (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Pencil / stylus top (vertical) -->
  <rect x="97" y="30" width="6" height="36" rx="2" fill="#10B981" opacity="0.5"/>
  <polygon points="97,30 103,30 100,22" fill="#10B981" opacity="0.8"/>
  <rect x="97" y="60" width="6" height="6" rx="1" fill="#10B981" opacity="0.3"/>

  <!-- Head -->
  <circle cx="100" cy="110" r="34" fill="#0E0E16" stroke="#10B981" stroke-width="2"/>

  <!-- Large monocle over LEFT eye -->
  <circle cx="86" cy="104" r="18" fill="none" stroke="#10B981" stroke-width="2"/>
  <circle cx="86" cy="104" r="14" fill="none" stroke="#10B981" stroke-width="0.75" stroke-opacity="0.3"/>
  <!-- Monocle chain dangling down-right -->
  <path d="M98,112 Q106,118 110,124" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 2"/>
  <!-- Eye inside monocle -->
  <circle cx="86" cy="104" r="7" fill="#10B981" opacity="0.8"/>
  <circle cx="86" cy="104" r="4" fill="#0E0E16"/>
  <circle cx="84" cy="102" r="1.5" fill="#10B981" opacity="0.7"/>
  <!-- Monocle lens reflection -->
  <path d="M76,98 Q78,96 80,97" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Right eye (small dot — relaxed/squinting through monocle) -->
  <circle cx="114" cy="104" r="4" fill="#10B981" opacity="0.7"/>
  <circle cx="114" cy="104" r="2" fill="#0E0E16"/>

  <!-- Arched eyebrows -->
  <path d="M76,92 Q86,88 96,92" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M108,92 Q114,89 120,92" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Thoughtful half-smile -->
  <path d="M94,124 Q104,130 112,124" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M52,166 Q64,144 100,144 Q136,144 148,166 L154,175 L46,175 Z"
        fill="#10B981" opacity="0.08" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>
</svg>
