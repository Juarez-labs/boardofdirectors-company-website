<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="motion-title">
  <title id="motion-title">Motion Designer — Flow Figure</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Motion trails (bezier curves behind figure) -->
  <path d="M30,90 C50,70 70,130 100,104" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M24,104 C48,84 72,124 100,104" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>
  <path d="M30,118 C52,138 74,80 100,104" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>

  <!-- Speed dash marks (left) -->
  <line x1="38" y1="88" x2="52" y2="88" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="34" y1="96" x2="50" y2="96" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round"/>
  <line x1="38" y1="104" x2="52" y2="104" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- Head (slightly tilted ellipse for dynamism) -->
  <ellipse cx="104" cy="102" rx="32" ry="34"
           fill="#0E0E16" stroke="#8B5CF6" stroke-width="2"
           transform="rotate(-5 104 102)"/>

  <!-- Left eye (elongated speed style) -->
  <ellipse cx="94" cy="97" rx="9" ry="6" fill="#8B5CF6" opacity="0.9"
           transform="rotate(-5 94 97)"/>
  <ellipse cx="94" cy="97" rx="5" ry="3.5" fill="#0E0E16"
           transform="rotate(-5 94 97)"/>
  <circle cx="92" cy="96" r="1.5" fill="#8B5CF6" opacity="0.7"/>

  <!-- Right eye (elongated speed style) -->
  <ellipse cx="116" cy="97" rx="9" ry="6" fill="#8B5CF6" opacity="0.9"
           transform="rotate(-5 116 97)"/>
  <ellipse cx="116" cy="97" rx="5" ry="3.5" fill="#0E0E16"
           transform="rotate(-5 116 97)"/>
  <circle cx="114" cy="96" r="1.5" fill="#8B5CF6" opacity="0.7"/>

  <!-- Bezier control points (hat/crown motif) -->
  <circle cx="94" cy="64" r="4" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="114" cy="58" r="4" fill="#8B5CF6" opacity="0.6"/>
  <path d="M94,64 C100,52 108,54 114,58" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Control handles -->
  <line x1="94" y1="64" x2="88" y2="72" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="114" y1="58" x2="120" y2="66" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="88" cy="72" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="120" cy="66" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Subtle smile -->
  <path d="M95,114 Q104,121 114,114" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M56,164 Q70,138 104,138 Q136,138 148,164 L154,175 L50,175 Z"
        fill="#8B5CF6" opacity="0.08" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2"/>
</svg>
