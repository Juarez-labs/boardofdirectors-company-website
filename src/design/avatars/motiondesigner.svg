<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="motion-title">
  <title id="motion-title">Motion Designer — Bezier Curves</title>

  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Control point lines (dashed, subtle) -->
  <line x1="44" y1="156" x2="72" y2="60" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3,4"/>
  <line x1="156" y1="44" x2="128" y2="140" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3,4"/>
  <line x1="44" y1="60" x2="100" y2="130" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3,4"/>
  <line x1="156" y1="140" x2="100" y2="70" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3,4"/>

  <!-- Primary bezier curve 1 (main arc) -->
  <path d="M44,156 C72,60 128,140 156,44"
        fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-opacity="0.9" stroke-linecap="round"/>

  <!-- Bezier curve 2 (crossing) -->
  <path d="M44,60 C100,130 100,70 156,140"
        fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Bezier curve 3 (subtle layer) -->
  <path d="M68,44 C80,100 120,100 132,156"
        fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Anchor points -->
  <circle cx="44" cy="156" r="5" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="156" cy="44" r="5" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="44" cy="60" r="4" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="156" cy="140" r="4" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Control point handles -->
  <circle cx="72" cy="60" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="128" cy="140" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="100" cy="130" r="3" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="100" cy="70" r="3" fill="#8B5CF6" opacity="0.5"/>

  <!-- Intersection highlight (motion inflection point) -->
  <circle cx="100" cy="100" r="7" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="100" cy="100" r="3.5" fill="#0E0E16"/>
</svg>
