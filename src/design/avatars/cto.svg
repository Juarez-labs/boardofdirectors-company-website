<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="cto-title">
  <title id="cto-title">CTO — Robot Technician</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Antenna -->
  <line x1="100" y1="34" x2="100" y2="66" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="100" cy="28" r="8" fill="#0E0E16" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="100" cy="28" r="4" fill="#06B6D4" opacity="0.9"/>
  <circle cx="100" cy="28" r="14" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Robot head -->
  <rect x="66" y="66" width="68" height="58" rx="8"
        fill="#0E0E16" stroke="#06B6D4" stroke-width="2"/>

  <!-- Visor strip -->
  <rect x="70" y="80" width="60" height="20" rx="3"
        fill="#06B6D4" opacity="0.08" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Left eye -->
  <rect x="76" y="83" width="20" height="14" rx="3" fill="#06B6D4" opacity="0.85"/>
  <rect x="80" y="86" width="8" height="8" rx="1" fill="#0E0E16"/>
  <circle cx="82" cy="88" r="2" fill="#06B6D4" opacity="0.7"/>

  <!-- Right eye -->
  <rect x="104" y="83" width="20" height="14" rx="3" fill="#06B6D4" opacity="0.85"/>
  <rect x="108" y="86" width="8" height="8" rx="1" fill="#0E0E16"/>
  <circle cx="110" cy="88" r="2" fill="#06B6D4" opacity="0.7"/>

  <!-- Mouth grill -->
  <line x1="80" y1="108" x2="88" y2="108" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="93" y1="108" x2="107" y2="108" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="112" y1="108" x2="120" y2="108" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Side indicator lights -->
  <circle cx="66" cy="86" r="4" fill="#06B6D4" opacity="0.6"/>
  <circle cx="66" cy="100" r="3" fill="#06B6D4" opacity="0.3"/>
  <circle cx="134" cy="86" r="4" fill="#06B6D4" opacity="0.6"/>
  <circle cx="134" cy="100" r="3" fill="#06B6D4" opacity="0.3"/>

  <!-- Circuit traces on head -->
  <line x1="82" y1="70" x2="82" y2="78" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="100" y1="70" x2="100" y2="80" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="118" y1="70" x2="118" y2="78" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Body / shoulders -->
  <path d="M60,160 L72,124 L128,124 L140,160 L148,172 L52,172 Z"
        fill="#06B6D4" opacity="0.08" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Chest badge -->
  <rect x="90" y="133" width="20" height="14" rx="3"
        fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="94" y1="140" x2="106" y2="140" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
