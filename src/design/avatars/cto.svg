<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="cto-title">
  <title id="cto-title">CTO — Circuit Trace</title>

  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Horizontal main bus -->
  <line x1="32" y1="100" x2="168" y2="100" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Vertical main bus -->
  <line x1="100" y1="32" x2="100" y2="168" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.5"/>

  <!-- L-trace top-left -->
  <polyline points="50,68 50,100 68,100" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- L-trace top-right -->
  <polyline points="150,68 150,100 132,100" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- L-trace bottom-left -->
  <polyline points="50,132 50,100 68,100" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- L-trace bottom-right -->
  <polyline points="150,132 150,100 132,100" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Branch traces -->
  <line x1="100" y1="68" x2="76" y2="68" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="100" y1="68" x2="124" y2="68" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="100" y1="132" x2="76" y2="132" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="100" y1="132" x2="124" y2="132" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Nodes (IC pads) -->
  <circle cx="50" cy="68" r="4" fill="#06B6D4" opacity="0.8"/>
  <circle cx="150" cy="68" r="4" fill="#06B6D4" opacity="0.8"/>
  <circle cx="50" cy="132" r="4" fill="#06B6D4" opacity="0.8"/>
  <circle cx="150" cy="132" r="4" fill="#06B6D4" opacity="0.8"/>
  <circle cx="76" cy="68" r="2.5" fill="#06B6D4" opacity="0.6"/>
  <circle cx="124" cy="68" r="2.5" fill="#06B6D4" opacity="0.6"/>
  <circle cx="76" cy="132" r="2.5" fill="#06B6D4" opacity="0.6"/>
  <circle cx="124" cy="132" r="2.5" fill="#06B6D4" opacity="0.6"/>

  <!-- Center IC chip -->
  <rect x="76" y="76" width="48" height="48" rx="4" fill="#0E0E16" stroke="#06B6D4" stroke-width="2"/>
  <rect x="84" y="84" width="32" height="32" rx="2" fill="#06B6D4" opacity="0.12"/>

  <!-- Center cross / processor mark -->
  <line x1="88" y1="100" x2="112" y2="100" stroke="#06B6D4" stroke-width="2"/>
  <line x1="100" y1="88" x2="100" y2="112" stroke="#06B6D4" stroke-width="2"/>
  <circle cx="100" cy="100" r="5" fill="#06B6D4"/>
</svg>
