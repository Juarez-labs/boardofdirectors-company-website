<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="sec-title">
  <title id="sec-title">Security Engineer — Shield Guard</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#EF4444" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Shield (top role symbol) -->
  <path d="M100,28 L128,40 L128,60 Q128,78 100,88 Q72,78 72,60 L72,40 Z"
        fill="#0E0E16" stroke="#EF4444" stroke-width="2" stroke-linejoin="round"/>
  <!-- Shield inner -->
  <path d="M100,36 L122,46 L122,62 Q122,74 100,82 Q78,74 78,62 L78,46 Z"
        fill="#EF4444" opacity="0.08"/>
  <!-- Lock icon on shield -->
  <rect x="93" y="56" width="14" height="12" rx="2"
        fill="#0E0E16" stroke="#EF4444" stroke-width="1.5"/>
  <path d="M93,56 Q93,48 100,48 Q107,48 107,56"
        fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <circle cx="100" cy="62" r="2.5" fill="#EF4444" opacity="0.8"/>

  <!-- Head -->
  <circle cx="100" cy="115" r="30" fill="#0E0E16" stroke="#EF4444" stroke-width="2"/>

  <!-- Vigilant narrow eyes -->
  <rect x="80" y="108" width="16" height="8" rx="4" fill="#EF4444" opacity="0.9"/>
  <circle cx="88" cy="112" r="3" fill="#0E0E16"/>
  <circle cx="87" cy="111" r="1" fill="#EF4444" opacity="0.8"/>

  <rect x="104" y="108" width="16" height="8" rx="4" fill="#EF4444" opacity="0.9"/>
  <circle cx="112" cy="112" r="3" fill="#0E0E16"/>
  <circle cx="111" cy="111" r="1" fill="#EF4444" opacity="0.8"/>

  <!-- Furrowed brow lines -->
  <line x1="80" y1="104" x2="96" y2="106" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="120" y1="104" x2="104" y2="106" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Firm set mouth -->
  <line x1="88" y1="126" x2="112" y2="126" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Shoulders (broader/heavier for guard feel) -->
  <path d="M48,166 Q58,138 100,138 Q142,138 152,166 L158,175 L42,175 Z"
        fill="#EF4444" opacity="0.08" stroke="#EF4444" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Collar badges -->
  <rect x="76" y="142" width="12" height="8" rx="2" fill="#EF4444" opacity="0.25"/>
  <rect x="112" y="142" width="12" height="8" rx="2" fill="#EF4444" opacity="0.25"/>
</svg>
