<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="motion-b-title">
  <title id="motion-b-title">Motion Designer — Vortex Figure (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Orbit ring around head (motion ring) -->
  <ellipse cx="100" cy="104" rx="46" ry="14" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 4"/>
  <!-- Orbit particle -->
  <circle cx="54" cy="104" r="4" fill="#8B5CF6" opacity="0.7"/>
  <!-- Orbit trailing dots -->
  <circle cx="60" cy="96" r="2" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="68" cy="90" r="1.5" fill="#8B5CF6" opacity="0.25"/>

  <!-- Vortex spiral top (role element) -->
  <path d="M100,34 Q118,42 116,58 Q114,74 100,76 Q86,74 84,58 Q82,42 100,34"
        fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M100,44 Q110,50 108,60 Q106,70 100,70 Q94,70 92,60 Q90,50 100,44"
        fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="100" cy="56" r="5" fill="#8B5CF6" opacity="0.7"/>

  <!-- Head -->
  <circle cx="100" cy="108" r="32" fill="#0E0E16" stroke="#8B5CF6" stroke-width="2"/>

  <!-- Motion-vector eyes (arrow / speed chevron style) -->
  <!-- Left eye: chevron pointing right -->
  <path d="M78,103 L86,99 L94,103 L86,107 Z" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="86" cy="103" r="3" fill="#0E0E16"/>
  <circle cx="85" cy="102" r="1.2" fill="#8B5CF6" opacity="0.7"/>
  <!-- Right eye -->
  <path d="M106,103 L114,99 L122,103 L114,107 Z" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="114" cy="103" r="3" fill="#0E0E16"/>
  <circle cx="113" cy="102" r="1.2" fill="#8B5CF6" opacity="0.7"/>

  <!-- Smile with motion tail -->
  <path d="M88,120 Q100,128 112,120" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>

  <!-- Speed lines from face (right side) -->
  <line x1="132" y1="96" x2="148" y2="92" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="134" y1="104" x2="152" y2="104" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round"/>
  <line x1="132" y1="112" x2="148" y2="116" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M54,166 Q66,140 100,140 Q134,140 146,166 L152,175 L48,175 Z"
        fill="#8B5CF6" opacity="0.08" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.2"/>
</svg>
