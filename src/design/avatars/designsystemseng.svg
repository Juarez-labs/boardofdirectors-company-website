<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="dse-title">
  <title id="dse-title">Design Systems Engineer — Grid Architect</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Component stack (top — role symbol) -->
  <rect x="76" y="34" width="48" height="10" rx="3"
        fill="#6366F1" opacity="0.5" stroke="#6366F1" stroke-width="1"/>
  <rect x="80" y="47" width="40" height="10" rx="3"
        fill="#6366F1" opacity="0.35" stroke="#6366F1" stroke-width="1"/>
  <rect x="84" y="60" width="32" height="8" rx="3"
        fill="#6366F1" opacity="0.2" stroke="#6366F1" stroke-width="1"/>

  <!-- Rectangular head -->
  <rect x="68" y="72" width="64" height="60" rx="8"
        fill="#0E0E16" stroke="#6366F1" stroke-width="2"/>

  <!-- Grid overlay on head -->
  <line x1="68" y1="92" x2="132" y2="92" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.25"/>
  <line x1="68" y1="112" x2="132" y2="112" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.25"/>
  <line x1="88" y1="72" x2="88" y2="132" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.25"/>
  <line x1="112" y1="72" x2="112" y2="132" stroke="#6366F1" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Left eye (block) -->
  <rect x="76" y="82" width="18" height="14" rx="3" fill="#6366F1" opacity="0.9"/>
  <rect x="80" y="85" width="8" height="8" rx="1" fill="#0E0E16"/>
  <rect x="82" y="87" width="4" height="4" rx="0.5" fill="#6366F1" opacity="0.8"/>

  <!-- Right eye (block) -->
  <rect x="106" y="82" width="18" height="14" rx="3" fill="#6366F1" opacity="0.9"/>
  <rect x="110" y="85" width="8" height="8" rx="1" fill="#0E0E16"/>
  <rect x="112" y="87" width="4" height="4" rx="0.5" fill="#6366F1" opacity="0.8"/>

  <!-- Neutral/precise mouth (straight line) -->
  <line x1="86" y1="118" x2="114" y2="118" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Side connection ports -->
  <rect x="60" y="88" width="8" height="6" rx="1" fill="#6366F1" opacity="0.4"/>
  <rect x="60" y="100" width="8" height="6" rx="1" fill="#6366F1" opacity="0.25"/>
  <rect x="132" y="88" width="8" height="6" rx="1" fill="#6366F1" opacity="0.4"/>
  <rect x="132" y="100" width="8" height="6" rx="1" fill="#6366F1" opacity="0.25"/>

  <!-- Shoulders -->
  <path d="M58,163 L70,132 L130,132 L142,163 L148,174 L52,174 Z"
        fill="#6366F1" opacity="0.08" stroke="#6366F1" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Chest: token grid -->
  <rect x="86" y="140" width="8" height="8" rx="1" fill="#6366F1" opacity="0.3"/>
  <rect x="96" y="140" width="8" height="8" rx="1" fill="#6366F1" opacity="0.2"/>
  <rect x="106" y="140" width="8" height="8" rx="1" fill="#6366F1" opacity="0.15"/>
</svg>
