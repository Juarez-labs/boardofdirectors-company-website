<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ceo-title">
  <title id="ceo-title">CEO — Placeholder Crown Figure</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Crown (role symbol) -->
  <polygon points="68,68 76,44 88,60 100,38 112,60 124,44 132,68"
           fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
  <line x1="68" y1="68" x2="132" y2="68" stroke="#F59E0B" stroke-width="2"/>
  <rect x="68" y="68" width="64" height="8" rx="2" fill="#F59E0B" opacity="0.2"/>

  <!-- Crown jewels -->
  <circle cx="100" cy="44" r="5" fill="#F59E0B" opacity="0.9"/>
  <circle cx="80" cy="50" r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="120" cy="50" r="3" fill="#F59E0B" opacity="0.6"/>

  <!-- Placeholder head (dashed — pending board input) -->
  <circle cx="100" cy="118" r="30" fill="#0E0E16"
          stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.5"/>

  <!-- Placeholder eyes -->
  <circle cx="90" cy="114" r="4" fill="#F59E0B" opacity="0.4"/>
  <circle cx="110" cy="114" r="4" fill="#F59E0B" opacity="0.4"/>

  <!-- Placeholder label -->
  <text x="100" y="126" text-anchor="middle" font-family="monospace" font-size="8"
        fill="#F59E0B" opacity="0.5" letter-spacing="2">PENDING</text>

  <!-- Shoulders -->
  <path d="M58,162 Q70,148 100,148 Q130,148 142,162 L148,175 L52,175 Z"
        fill="#F59E0B" opacity="0.08" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2"/>
</svg>
