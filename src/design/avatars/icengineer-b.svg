<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ice-b-title">
  <title id="ice-b-title">IC Engineer — Terminal Coder (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Terminal window (top role element) -->
  <rect x="64" y="28" width="72" height="46" rx="6"
        fill="#0E0E16" stroke="#F97316" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="64" y="28" width="72" height="10" rx="6"
        fill="#F97316" opacity="0.15"/>
  <line x1="64" y1="38" x2="136" y2="38" stroke="#F97316" stroke-width="0.75" stroke-opacity="0.4"/>
  <!-- Title bar dots -->
  <circle cx="72" cy="33" r="2" fill="#EF4444" opacity="0.6"/>
  <circle cx="80" cy="33" r="2" fill="#EAB308" opacity="0.6"/>
  <circle cx="88" cy="33" r="2" fill="#10B981" opacity="0.6"/>
  <!-- Code lines -->
  <text x="70" y="50" font-family="monospace" font-size="8" fill="#F97316" opacity="0.7">&lt;/&gt;</text>
  <line x1="70" y1="58" x2="106" y2="58" stroke="#F97316" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="70" y1="64" x2="118" y2="64" stroke="#F97316" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Head -->
  <circle cx="100" cy="118" r="32" fill="#0E0E16" stroke="#F97316" stroke-width="2"/>

  <!-- Left eye (code bracket style) -->
  <text x="80" y="117" font-family="monospace" font-size="18" fill="#F97316" opacity="0.9">{</text>
  <!-- Right eye (closing bracket) -->
  <text x="108" y="117" font-family="monospace" font-size="18" fill="#F97316" opacity="0.9">}</text>

  <!-- Smirk -->
  <path d="M88,130 Q102,138 114,130" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Wrench tool (left side, engineer motif) -->
  <path d="M42,86 Q38,80 42,74 Q48,70 54,74 L70,90 L66,94 Z"
        fill="#0E0E16" stroke="#F97316" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.6"/>
  <line x1="54" y1="74" x2="70" y2="90" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Shoulders -->
  <path d="M54,166 Q66,150 100,150 Q134,150 146,166 L152,175 L48,175 Z"
        fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="1" stroke-opacity="0.2"/>
</svg>
