<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="qc-b-title">
  <title id="qc-b-title">QC Agent — Magnifier-Eye Inspector (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Inspection grid lines (background data grid) -->
  <line x1="40" y1="60" x2="160" y2="60" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="40" y1="80" x2="160" y2="80" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="40" y1="120" x2="160" y2="120" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="40" y1="140" x2="160" y2="140" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="60" y1="40" x2="60" y2="160" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="80" y1="40" x2="80" y2="160" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="120" y1="40" x2="120" y2="160" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="140" y1="40" x2="140" y2="160" stroke="#14B8A6" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- Head -->
  <circle cx="100" cy="106" r="34" fill="#0E0E16" stroke="#14B8A6" stroke-width="2"/>

  <!-- Left eye: magnifying glass replacing the eye -->
  <circle cx="84" cy="100" r="14" fill="none" stroke="#14B8A6" stroke-width="2"/>
  <circle cx="84" cy="100" r="9" fill="#14B8A6" opacity="0.1"/>
  <!-- Eye pupil inside magnifier -->
  <circle cx="84" cy="100" r="5" fill="#14B8A6" opacity="0.8"/>
  <circle cx="84" cy="100" r="2.5" fill="#0E0E16"/>
  <circle cx="82" cy="98" r="1" fill="#14B8A6" opacity="0.7"/>
  <!-- Magnifier handle -->
  <line x1="94" y1="110" x2="104" y2="120" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Right eye: normal, wide alert -->
  <circle cx="116" cy="100" r="8" fill="#14B8A6" opacity="0.85"/>
  <circle cx="116" cy="100" r="4.5" fill="#0E0E16"/>
  <circle cx="114" cy="98" r="1.5" fill="#14B8A6" opacity="0.7"/>

  <!-- Raised analytical eyebrow (right) -->
  <path d="M108,90 Q116,86 124,90" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Checkmark mouth (✓ as smile) -->
  <path d="M86,120 L94,128 L116,106" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>

  <!-- Measurement ruler (below chin — QC tool) -->
  <rect x="68" y="142" width="64" height="6" rx="2" fill="none" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="76" y1="142" x2="76" y2="148" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="84" y1="142" x2="84" y2="148" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="92" y1="142" x2="92" y2="148" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="100" y1="142" x2="100" y2="148" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="108" y1="142" x2="108" y2="148" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="116" y1="142" x2="116" y2="148" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="124" y1="142" x2="124" y2="148" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Shoulders -->
  <path d="M50,168 Q62,152 100,152 Q138,152 150,168 L156,175 L44,175 Z"
        fill="#14B8A6" opacity="0.07" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.2"/>
</svg>
