<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="cto-b-title">
  <title id="cto-b-title">CTO — Cyclops Scanner (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Circuit halo (floats above the round helmet) -->
  <circle cx="100" cy="80" r="42" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  <!-- Halo nodes -->
  <circle cx="100" cy="38" r="4" fill="#06B6D4" opacity="0.6"/>
  <circle cx="140" cy="60" r="3" fill="#06B6D4" opacity="0.4"/>
  <circle cx="60" cy="60" r="3" fill="#06B6D4" opacity="0.4"/>
  <!-- Halo connection lines -->
  <line x1="100" y1="42" x2="100" y2="54" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="137" y1="63" x2="126" y2="70" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="63" y1="63" x2="74" y2="70" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Round helmet head -->
  <circle cx="100" cy="104" r="36" fill="#0E0E16" stroke="#06B6D4" stroke-width="2"/>
  <!-- Helmet dome highlight -->
  <path d="M72,86 Q100,72 128,86" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Single Cyclops scanner eye — horizontal LED strip -->
  <rect x="74" y="97" width="52" height="14" rx="7"
        fill="#0E0E16" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="76" y="99" width="48" height="10" rx="5"
        fill="#06B6D4" opacity="0.15"/>
  <!-- Scanner beam moving across (represented as bright center) -->
  <ellipse cx="100" cy="104" rx="16" ry="4" fill="#06B6D4" opacity="0.5"/>
  <ellipse cx="100" cy="104" rx="8" ry="2.5" fill="#06B6D4" opacity="0.8"/>
  <!-- Scan line dots -->
  <circle cx="82" cy="104" r="1.5" fill="#06B6D4" opacity="0.4"/>
  <circle cx="118" cy="104" r="1.5" fill="#06B6D4" opacity="0.4"/>

  <!-- Microphone / speaker grill (mouth area) -->
  <line x1="84" y1="120" x2="92" y2="120" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="96" y1="120" x2="104" y2="120" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="108" y1="120" x2="116" y2="120" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Side ear ports / heat vents -->
  <rect x="63" y="96" width="7" height="18" rx="2" fill="#0E0E16" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="64" y1="100" x2="70" y2="100" stroke="#06B6D4" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="64" y1="104" x2="70" y2="104" stroke="#06B6D4" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="64" y1="108" x2="70" y2="108" stroke="#06B6D4" stroke-width="0.75" stroke-opacity="0.4"/>
  <rect x="130" y="96" width="7" height="18" rx="2" fill="#0E0E16" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="130" y1="100" x2="136" y2="100" stroke="#06B6D4" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="130" y1="104" x2="136" y2="104" stroke="#06B6D4" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="130" y1="108" x2="136" y2="108" stroke="#06B6D4" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Shoulders -->
  <path d="M54,165 Q66,140 100,140 Q134,140 146,165 L152,175 L48,175 Z"
        fill="#06B6D4" opacity="0.08" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2"/>
</svg>
