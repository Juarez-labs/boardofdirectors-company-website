<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="docops-b-title">
  <title id="docops-b-title">DocOps — Librarian Scholar (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Open book (top role element) -->
  <!-- Left page -->
  <path d="M66,34 Q66,28 72,28 L100,32 L100,68 L72,64 Q66,64 66,58 Z"
        fill="#0E0E16" stroke="#EAB308" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M134,34 Q134,28 128,28 L100,32 L100,68 L128,64 Q134,64 134,58 Z"
        fill="#0E0E16" stroke="#EAB308" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Book spine center line -->
  <line x1="100" y1="32" x2="100" y2="68" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Page lines left -->
  <line x1="72" y1="40" x2="97" y2="41" stroke="#EAB308" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="72" y1="48" x2="97" y2="49" stroke="#EAB308" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="72" y1="56" x2="97" y2="57" stroke="#EAB308" stroke-width="0.75" stroke-opacity="0.3"/>
  <!-- Page lines right -->
  <line x1="103" y1="41" x2="128" y2="40" stroke="#EAB308" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="103" y1="49" x2="128" y2="48" stroke="#EAB308" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="103" y1="57" x2="128" y2="56" stroke="#EAB308" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Head -->
  <circle cx="100" cy="116" r="32" fill="#0E0E16" stroke="#EAB308" stroke-width="2"/>

  <!-- Half-moon reading glasses (lower on face) -->
  <path d="M80,114 Q86,108 92,114" fill="none" stroke="#EAB308" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M108,114 Q114,108 120,114" fill="none" stroke="#EAB308" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="92" y1="114" x2="108" y2="114" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="80" y1="114" x2="72" y2="114" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="120" y1="114" x2="128" y2="114" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Eyes (above the half-moon glasses) -->
  <circle cx="86" cy="106" r="4.5" fill="#EAB308" opacity="0.8"/>
  <circle cx="86" cy="106" r="2" fill="#0E0E16"/>
  <circle cx="114" cy="106" r="4.5" fill="#EAB308" opacity="0.8"/>
  <circle cx="114" cy="106" r="2" fill="#0E0E16"/>

  <!-- Ink-drop accent on cheek -->
  <ellipse cx="126" cy="112" rx="3" ry="4" fill="#EAB308" opacity="0.25"
           transform="rotate(15 126 112)"/>

  <!-- Gentle knowing smile -->
  <path d="M88,128 Q100,136 112,128" fill="none" stroke="#EAB308" stroke-width="2" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M52,166 Q64,148 100,148 Q136,148 148,166 L154,175 L48,175 Z"
        fill="#EAB308" opacity="0.08" stroke="#EAB308" stroke-width="1" stroke-opacity="0.2"/>
</svg>
