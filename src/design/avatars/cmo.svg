<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="cmo-title">
  <title id="cmo-title">CMO — Signal Broadcaster</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#EC4899" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Broadcast signal arcs (left) -->
  <path d="M52,76 Q36,100 52,124" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M42,68 Q20,100 42,132" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Broadcast signal arcs (right) -->
  <path d="M148,76 Q164,100 148,124" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M158,68 Q180,100 158,132" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Signal source dots -->
  <circle cx="52" cy="100" r="3" fill="#EC4899" opacity="0.5"/>
  <circle cx="148" cy="100" r="3" fill="#EC4899" opacity="0.5"/>

  <!-- Head -->
  <circle cx="100" cy="104" r="34" fill="#0E0E16" stroke="#EC4899" stroke-width="2"/>

  <!-- Hair / top flair -->
  <path d="M80,80 Q100,62 120,80" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="68" r="5" fill="#EC4899" opacity="0.7"/>

  <!-- Left eye -->
  <ellipse cx="88" cy="100" rx="7" ry="8" fill="#EC4899" opacity="0.9"/>
  <ellipse cx="88" cy="101" rx="4" ry="5" fill="#0E0E16"/>
  <circle cx="87" cy="99" r="1.5" fill="#EC4899" opacity="0.8"/>

  <!-- Right eye -->
  <ellipse cx="112" cy="100" rx="7" ry="8" fill="#EC4899" opacity="0.9"/>
  <ellipse cx="112" cy="101" rx="4" ry="5" fill="#0E0E16"/>
  <circle cx="111" cy="99" r="1.5" fill="#EC4899" opacity="0.8"/>

  <!-- Smile -->
  <path d="M90,116 Q100,124 110,116" fill="none" stroke="#EC4899" stroke-width="2" stroke-linecap="round"/>

  <!-- Cheek blush marks -->
  <ellipse cx="80" cy="112" rx="6" ry="3" fill="#EC4899" opacity="0.2"/>
  <ellipse cx="120" cy="112" rx="6" ry="3" fill="#EC4899" opacity="0.2"/>

  <!-- Shoulders -->
  <path d="M54,164 Q66,138 100,138 Q134,138 146,164 L152,175 L48,175 Z"
        fill="#EC4899" opacity="0.08" stroke="#EC4899" stroke-width="1" stroke-opacity="0.2"/>
</svg>
