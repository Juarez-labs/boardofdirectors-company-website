<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="sec-b-title">
  <title id="sec-b-title">Security Engineer — Hex Grid Guard (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Hexagonal frame around head (shield as hex) -->
  <polygon points="100,60 134,80 134,120 100,140 66,120 66,80"
           fill="none" stroke="#EF4444" stroke-width="2" stroke-opacity="0.6" stroke-linejoin="round"/>
  <polygon points="100,54 140,76 140,124 100,146 60,124 60,76"
           fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.2" stroke-linejoin="round"/>

  <!-- Head inside hex frame -->
  <circle cx="100" cy="100" r="30" fill="#0E0E16" stroke="#EF4444" stroke-width="1.5"/>

  <!-- Left eye: scanning red beam panel -->
  <rect x="76" y="92" width="18" height="10" rx="2" fill="#0E0E16" stroke="#EF4444" stroke-width="1"/>
  <rect x="77" y="93" width="16" height="8" rx="1" fill="#EF4444" opacity="0.15"/>
  <line x1="77" y1="97" x2="93" y2="97" stroke="#EF4444" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Scanner glow -->
  <circle cx="85" cy="97" r="3" fill="#EF4444" opacity="0.5"/>

  <!-- Right eye: same -->
  <rect x="106" y="92" width="18" height="10" rx="2" fill="#0E0E16" stroke="#EF4444" stroke-width="1"/>
  <rect x="107" y="93" width="16" height="8" rx="1" fill="#EF4444" opacity="0.15"/>
  <line x1="107" y1="97" x2="123" y2="97" stroke="#EF4444" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="115" cy="97" r="3" fill="#EF4444" opacity="0.5"/>

  <!-- Fingerprint forehead pattern (security biometric) -->
  <path d="M96,80 Q100,76 104,80" fill="none" stroke="#EF4444" stroke-width="0.75" stroke-opacity="0.5"/>
  <path d="M93,84 Q100,78 107,84" fill="none" stroke="#EF4444" stroke-width="0.75" stroke-opacity="0.4"/>
  <path d="M91,88 Q100,82 109,88" fill="none" stroke="#EF4444" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Stern flat mouth -->
  <line x1="86" y1="112" x2="114" y2="112" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Binary accents in hex corners -->
  <text x="70" y="78" font-family="monospace" font-size="7" fill="#EF4444" opacity="0.3">10</text>
  <text x="122" y="78" font-family="monospace" font-size="7" fill="#EF4444" opacity="0.3">01</text>
  <text x="68" y="124" font-family="monospace" font-size="7" fill="#EF4444" opacity="0.3">11</text>
  <text x="120" y="124" font-family="monospace" font-size="7" fill="#EF4444" opacity="0.3">00</text>

  <!-- Shoulders -->
  <path d="M48,166 Q60,140 100,140 Q140,140 152,166 L158,175 L42,175 Z"
        fill="#EF4444" opacity="0.08" stroke="#EF4444" stroke-width="1" stroke-opacity="0.25"/>
</svg>
