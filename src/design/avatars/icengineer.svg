<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ice-title">
  <title id="ice-title">IC Engineer — Block Builder</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#F97316" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Isometric hard hat (top role element) -->
  <!-- Hat brim -->
  <ellipse cx="100" cy="60" rx="36" ry="8" fill="#0E0E16" stroke="#F97316" stroke-width="1.5"/>
  <!-- Hat dome -->
  <path d="M64,60 Q64,32 100,32 Q136,32 136,60"
        fill="#0E0E16" stroke="#F97316" stroke-width="1.5"/>
  <!-- Hat top face (isometric look) -->
  <path d="M76,46 L100,38 L124,46 L100,54 Z"
        fill="#F97316" opacity="0.2" stroke="#F97316" stroke-width="1" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="100" cy="112" r="32" fill="#0E0E16" stroke="#F97316" stroke-width="2"/>

  <!-- Left eye -->
  <circle cx="88" cy="107" r="7" fill="#F97316" opacity="0.85"/>
  <circle cx="88" cy="107" r="4" fill="#0E0E16"/>
  <circle cx="86" cy="105" r="2" fill="#F97316" opacity="0.7"/>

  <!-- Right eye -->
  <circle cx="112" cy="107" r="7" fill="#F97316" opacity="0.85"/>
  <circle cx="112" cy="107" r="4" fill="#0E0E16"/>
  <circle cx="110" cy="105" r="2" fill="#F97316" opacity="0.7"/>

  <!-- Confident straight mouth -->
  <path d="M90,122 Q100,128 110,122" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating isometric cubes (maker motif) -->
  <!-- Small cube left -->
  <path d="M48,88 L56,84 L64,88 L64,98 L56,102 L48,98 Z"
        fill="#0E0E16" stroke="#F97316" stroke-width="1" stroke-opacity="0.5" stroke-linejoin="round"/>
  <line x1="56" y1="84" x2="56" y2="94" stroke="#F97316" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="48" y1="88" x2="64" y2="88" stroke="#F97316" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Small cube right -->
  <path d="M136,88 L144,84 L152,88 L152,98 L144,102 L136,98 Z"
        fill="#0E0E16" stroke="#F97316" stroke-width="1" stroke-opacity="0.5" stroke-linejoin="round"/>
  <line x1="144" y1="84" x2="144" y2="94" stroke="#F97316" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="136" y1="88" x2="152" y2="88" stroke="#F97316" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Shoulders -->
  <path d="M54,165 Q66,144 100,144 Q134,144 146,165 L152,175 L48,175 Z"
        fill="#F97316" opacity="0.08" stroke="#F97316" stroke-width="1" stroke-opacity="0.2"/>
</svg>
