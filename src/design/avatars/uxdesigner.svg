<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ux-title">
  <title id="ux-title">UX Designer — Spiral Observer</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Cursor / stylus (top role element) -->
  <line x1="100" y1="34" x2="100" y2="66" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <polygon points="100,34 106,46 100,42 94,46" fill="#10B981" opacity="0.8"/>
  <circle cx="100" cy="66" r="3" fill="#10B981" opacity="0.5"/>

  <!-- Head -->
  <circle cx="100" cy="106" r="34" fill="#0E0E16" stroke="#10B981" stroke-width="2"/>

  <!-- Left lens (glasses) -->
  <circle cx="86" cy="102" r="14" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Fibonacci spiral in left lens (approximate with arcs) -->
  <path d="M86,102 Q94,102 94,94 Q94,88 88,88" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M88,88 Q80,88 80,96 Q80,108 92,108" fill="none" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Right lens (glasses) -->
  <circle cx="114" cy="102" r="14" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Eye in right lens -->
  <circle cx="114" cy="102" r="6" fill="#10B981" opacity="0.8"/>
  <circle cx="114" cy="102" r="3" fill="#0E0E16"/>
  <circle cx="112" cy="100" r="1.5" fill="#10B981" opacity="0.7"/>

  <!-- Glasses bridge -->
  <line x1="100" y1="102" x2="100" y2="102" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <path d="M100,102 L100,102" stroke="#10B981" stroke-width="2"/>
  <!-- Actual bridge line between the two lenses -->
  <line x1="100" y1="102" x2="100" y2="102" stroke="#10B981" stroke-width="1.5"/>
  <path d="M100,101 L100,103" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Eyebrow above left lens -->
  <path d="M78,86 Q86,82 94,86" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Eyebrow above right lens -->
  <path d="M106,86 Q114,82 122,86" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Thoughtful mouth -->
  <path d="M92,120 Q100,126 108,120" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M54,164 Q66,140 100,140 Q134,140 146,164 L152,175 L48,175 Z"
        fill="#10B981" opacity="0.08" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>
</svg>
