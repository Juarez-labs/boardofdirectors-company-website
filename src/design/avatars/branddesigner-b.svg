<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="brand-b-title">
  <title id="brand-b-title">Brand Designer — Prism Face (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Prism rainbow spectrum rays upward (role element) -->
  <line x1="100" y1="90" x2="84" y2="34" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="100" y1="90" x2="90" y2="32" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="100" y1="90" x2="97" y2="30" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="100" y1="90" x2="103" y2="30" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="100" y1="90" x2="110" y2="32" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="100" y1="90" x2="116" y2="34" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Diamond/gem-shaped head (the face IS the gem) -->
  <polygon points="100,84 136,110 100,148 64,110"
           fill="#0E0E16" stroke="#A855F7" stroke-width="2" stroke-linejoin="round"/>
  <!-- Facet lines on gem-face -->
  <line x1="100" y1="84" x2="100" y2="148" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.2"/>
  <line x1="64" y1="110" x2="136" y2="110" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.2"/>
  <line x1="100" y1="84" x2="64" y2="110" stroke="#A855F7" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="100" y1="84" x2="136" y2="110" stroke="#A855F7" stroke-width="0.5" stroke-opacity="0.15"/>
  <!-- Top facet fill (highlight) -->
  <polygon points="100,84 120,97 100,110 80,97" fill="#A855F7" opacity="0.06"/>

  <!-- Left facet eye (gemstone) -->
  <polygon points="84,104 90,100 90,108 84,104" fill="#A855F7" opacity="0.9"/>
  <circle cx="88" cy="104" r="2" fill="#0E0E16"/>

  <!-- Right facet eye (gemstone) -->
  <polygon points="116,104 110,100 110,108 116,104" fill="#A855F7" opacity="0.9"/>
  <circle cx="112" cy="104" r="2" fill="#0E0E16"/>

  <!-- Center gem gleam / nose point -->
  <circle cx="100" cy="110" r="3" fill="#A855F7" opacity="0.5"/>

  <!-- Mouth: lower facet edge as smile -->
  <path d="M84,116 Q100,124 116,116" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M52,168 Q64,148 100,148 Q136,148 148,168 L154,175 L46,175 Z"
        fill="#A855F7" opacity="0.08" stroke="#A855F7" stroke-width="1" stroke-opacity="0.2"/>
</svg>
