<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="brand-title">
  <title id="brand-title">Brand Designer — Gem Creator</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#A855F7" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Gem / prism (top role symbol) -->
  <polygon points="100,30 126,50 116,70 84,70 74,50"
           fill="#0E0E16" stroke="#A855F7" stroke-width="2" stroke-linejoin="round"/>
  <!-- Gem facets -->
  <line x1="100" y1="30" x2="116" y2="70" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="100" y1="30" x2="84" y2="70" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="100" y1="30" x2="100" y2="70" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.3"/>
  <line x1="74" y1="50" x2="126" y2="50" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.3"/>
  <!-- Gem top highlight -->
  <polygon points="100,30 112,50 100,46 88,50"
           fill="#A855F7" opacity="0.12"/>
  <!-- Gem center gleam -->
  <circle cx="100" cy="52" r="4" fill="#A855F7" opacity="0.7"/>

  <!-- Spectrum rays from gem (subtle color hint) -->
  <line x1="74" y1="70" x2="62" y2="82" stroke="#EC4899" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="84" y1="70" x2="76" y2="80" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="116" y1="70" x2="124" y2="80" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="126" y1="70" x2="138" y2="82" stroke="#10B981" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Head -->
  <circle cx="100" cy="114" r="32" fill="#0E0E16" stroke="#A855F7" stroke-width="2"/>

  <!-- Left eye (sparkle) -->
  <circle cx="88" cy="110" r="6" fill="#A855F7" opacity="0.9"/>
  <circle cx="88" cy="110" r="3" fill="#0E0E16"/>
  <circle cx="86" cy="108" r="1.5" fill="#A855F7" opacity="0.8"/>
  <!-- Sparkle rays around left eye -->
  <line x1="82" y1="104" x2="80" y2="102" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="88" y1="102" x2="88" y2="100" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="94" y1="104" x2="96" y2="102" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Right eye (sparkle) -->
  <circle cx="112" cy="110" r="6" fill="#A855F7" opacity="0.9"/>
  <circle cx="112" cy="110" r="3" fill="#0E0E16"/>
  <circle cx="110" cy="108" r="1.5" fill="#A855F7" opacity="0.8"/>
  <line x1="106" y1="104" x2="104" y2="102" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="112" y1="102" x2="112" y2="100" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="118" y1="104" x2="120" y2="102" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Warm smile -->
  <path d="M90,124 Q100,133 110,124" fill="none" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>

  <!-- Colour palette dots (chin level — design tool motif) -->
  <circle cx="84" cy="136" r="3" fill="#EC4899" opacity="0.5"/>
  <circle cx="92" cy="139" r="3" fill="#F59E0B" opacity="0.5"/>
  <circle cx="100" cy="140" r="3" fill="#10B981" opacity="0.5"/>
  <circle cx="108" cy="139" r="3" fill="#06B6D4" opacity="0.5"/>
  <circle cx="116" cy="136" r="3" fill="#8B5CF6" opacity="0.5"/>

  <!-- Shoulders -->
  <path d="M54,166 Q66,146 100,146 Q134,146 146,166 L152,175 L48,175 Z"
        fill="#A855F7" opacity="0.08" stroke="#A855F7" stroke-width="1" stroke-opacity="0.2"/>
</svg>
