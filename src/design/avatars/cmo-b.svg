<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="cmo-b-title">
  <title id="cmo-b-title">CMO — Megaphone Star (Variant B)</title>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="#0E0E16" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Starburst top (broadcast energy) -->
  <circle cx="100" cy="52" r="16" fill="#0E0E16" stroke="#EC4899" stroke-width="1.5"/>
  <circle cx="100" cy="52" r="10" fill="#EC4899" opacity="0.15"/>
  <circle cx="100" cy="52" r="5" fill="#EC4899" opacity="0.7"/>
  <!-- Star rays -->
  <line x1="100" y1="32" x2="100" y2="40" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="118" y1="34" x2="113" y2="41" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="82" y1="34" x2="87" y2="41" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="124" y1="52" x2="116" y2="52" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="76" y1="52" x2="84" y2="52" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="118" y1="70" x2="113" y2="63" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="82" y1="70" x2="87" y2="63" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Head (angular diamond shape for CMO-B) -->
  <ellipse cx="100" cy="112" rx="32" ry="34" fill="#0E0E16" stroke="#EC4899" stroke-width="2"/>

  <!-- Left eye (cat-eye / dramatic) -->
  <path d="M80,105 Q88,99 96,105 Q88,108 80,105 Z" fill="#EC4899" opacity="0.9"/>
  <ellipse cx="88" cy="105" rx="4" ry="3" fill="#0E0E16"/>
  <circle cx="87" cy="104" r="1.2" fill="#EC4899" opacity="0.8"/>

  <!-- Right eye (cat-eye / dramatic) -->
  <path d="M104,105 Q112,99 120,105 Q112,108 104,105 Z" fill="#EC4899" opacity="0.9"/>
  <ellipse cx="112" cy="105" rx="4" ry="3" fill="#0E0E16"/>
  <circle cx="111" cy="104" r="1.2" fill="#EC4899" opacity="0.8"/>

  <!-- Raised eyebrow (confident) -->
  <path d="M80,99 Q88,95 96,98" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M104,98 Q112,95 120,99" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Bold smile -->
  <path d="M86,124 Q100,135 114,124" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M86,124 Q100,130 114,124" fill="#EC4899" opacity="0.1"/>

  <!-- Megaphone (left shoulder — instead of arcs) -->
  <path d="M38,100 L58,88 L58,118 Z" fill="#EC4899" opacity="0.3" stroke="#EC4899" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="38" y="100" width="12" height="12" rx="2" fill="#0E0E16" stroke="#EC4899" stroke-width="1.5" transform="translate(-6,-6) rotate(0 38 106)"/>
  <!-- Sound waves from megaphone -->
  <path d="M30,94 Q22,100 30,106" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M26,90 Q14,100 26,110" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- Shoulders -->
  <path d="M54,166 Q66,146 100,146 Q134,146 146,166 L152,175 L48,175 Z"
        fill="#EC4899" opacity="0.08" stroke="#EC4899" stroke-width="1" stroke-opacity="0.2"/>
</svg>
